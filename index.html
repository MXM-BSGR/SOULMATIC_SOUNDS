<!DOCTYPE html>

    <meta charset="UTF-8">

    <title>Soulmatic Sounds</title>
    <!-- #region  LINKS  -->

    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/fonts.css">
    <link rel="stylesheet" href="./css/general.css">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./css/media-querries.css">

    <!-- #region  SCRIPT  -->
    <script defer src="./js/json-shoping-cart.js"></script>
    <script defer src="./js/json-image-info.js"></script>
    <script defer src="./js/json-product-catalog.js"></script>
    <script defer src="./js/templates.js"></script>
    <script defer src="./script.js"></script>

<body onload="init()">
    <!-- ------------------------------------------------------------- -->
    <!-- #region  HEADER  -->
    <header class="MainHeader">
        <div id="idLogoWrapper" class="LogoWrapper">
            <!-- <img class="HeaderLogo" src="./assets/img/logo.jpg" alt=" dsaf"> -->
            <img class="HeaderLettering" src="./assets/icons/lettering.svg" alt="">
        </div>
        <button type="button" class="MenuButton">
            <!-- <img src="./assets/icons/burger-menu-button.svg" alt="a"> -->
        </button>
    </header>
    <!-- #endregion -->
    <!-- ------------------------------------------------------------- -->

    <!-- #region  MAIN  -->
    <main>
        <section id="idHeroSection" class="HeroSection">
            <img src="./assets/img/detailed-logo.jpg" class="DetailedLogo" alt="logo of Soulmatic Sounds">
        </section>
        <section id="idHeroHeading" class="HeroHeading">
            <div id="idHeroEyebrow" class="HeroEyebrow">
                <img id="idRatingsIcon" class="RatingsIcon" src="./assets/icons/rating-star.svg"
                    alt="rating star icon ">
                <p id="idAverageRatingStars" class="AverageRatingStars"><b>4,1</b></p>
                <p id="idAmountOfRatings" class="AmountOfRatings">(333)</p>
            </div>
            <h1 id="idHeading" class="Heading">
                <span id="idColoredPartOfHeading" class="ColoredPartOfHeading">Soul</span>matic Sounds
            </h1>
            <p id="idSubHeading" class="SubHeading">...created by Emotion, transmitted by Air, recieved by your Body
            </p>
        </section>

        <section id="idOrderArea" class="OrderArea">
            <div id="idProductCategorysWrapper" class="ProductCategorysWrapper ">

                <div id="idAllCategories" class="AllCategories"></div>
            </div>
            <!-- #region  MOBILE SHOPING CART -->

            <!-- #endregion -->
            <!-- ------------------------------------------------------------- -->


        </section>

        <!-- #region  ORDER CONFIRMED MODAL  -->

            <button type="button" id="idConfirmationModalCloseButton" class="ConfirmationModalCloseButton"></button>
            <img id="idDownloadQRCode" class="DownloadQRCode" src="./assets/icons/qr-code.svg" alt="mail sent icon">
            <h2 id="idConfirmationModalHeading" class="ConfirmationModalHeading">Order confirmed!</h2>
            <p id="idConfirmationModalSubheading" class="ConfirmationModalSubheading">Download via QR-Code<br>
                <span id="idConfirmationInfoDivider" class="ConfirmationInfoDivider">or</span><br>
                check your email, we sent you a Download-Link!
            </p>
            <img id="idMailSentIcon" class="MailSentIcon" src="./assets/icons/marked-email.svg"
                alt="mail sent icon"><br>

        </dialog> -->

        <!-- #endregion -->
        <!-- ------------------------------------------------------------- -->
    </main>
    <!-- #endregion -->
    <!-- ------------------------------------------------------------- -->

    <!-- #region  FOOTER  -->
    <footer class="MainFooter">

        <section id="idInternalLinks" class="InternalLinks">
            <a href="./html/imprint.html">Imprint</a>
            <a href="./html/cookie-preferences.html">Cookie Preferences</a>
        </section>

        <div id="idCopyrightWrapper" class="CopyrightWrapper">
            <img src="./assets/icons/copyright.svg" alt="copy">
            <p>Soulmatic Sounds</p>
        </div>
    </footer>
    <!-- #endregion -->
    <!-- ------------------------------------------------------------- -->

    <!-- #region  MOBILE NAVIGATION  -->
    <nav id="idMobileNavigation" class="MobileNavigation Show">
        <ul id="idMobileNavigationLinkWrapper" class="MobileNavigationLinkWrapper Show">
            <li id="idMobileNavigationLinkHome" class="MobileNavigationLinkHome">
                <a id="idLinkToHome" class="MobileNavigationLink">
                    <button id="idHomeButton" type="button" class="MobileNavigationButton">
                        <img id="idHomeIcon" class="HomeIcon" src="./assets/icons/home-button.svg" alt="house icon">
                    </button>
                </a>
            </li>
            <li id="idMobileNavigationProfileLink" class="MobileNavigationProfileLink">
                <a id="idLinkToProfile" class="MobileNavigationLink">
                    <button id="idProfileButton" type="button" class="MobileNavigationButton">
                        <img id="idProfileIcon" class="ProfileIcon" src="./assets/icons/profile-button.svg"
                            alt="silhouette of a person icon">
                    </button>
                </a>
            </li>
            <li id="idMobileNavigationOrderHistoryLink" class="MobileNavigationOverviewLink">
                <a id="idLinkToOrderHistory" class="MobileNavigationLink">
                    <button type="button" id="idOrderHistoryButton" class="MobileNavigationButton OrderHistoryButton">
                        <img id="idOrderHistoryIcon" class="OrderHistoryIcon"
                            src="./assets/icons/order-history-button.svg" alt="order overview list icon ">
                    </button>
                </a>
            </li>
            <li id="idMobileNavigationShopingCartLink" class="MobileNavigationLinkHome">
                <a id="" class="MobileNavigationLink">
                    <button type="button" id="idShopingCartButton" class="MobileNavigationButton ShopingCartButton">
                        <img src="./assets/icons/shoping-trolley.svg" alt="shoping trolley icon">
                        <p id="idCurrentShopingCartContent" class="CurrentShopingCartContent">1</p>
                    </button>
                </a>
            </li>
        </ul>
    </nav>
